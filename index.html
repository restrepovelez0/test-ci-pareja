<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa para Dos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3CradialGradient id=%27a%27 cx=%2730%25%27 cy=%2730%25%27%3E%3Cstop offset=%270%27 stop-color=%27%23ff4704%27/%3E%3Cstop offset=%271%27 stop-color=%27%23ff9ec0%27 stop-opacity=%270%27/%3E%3C/radialGradient%3E%3CradialGradient id=%27b%27 cx=%2770%25%27 cy=%2770%25%27%3E%3Cstop offset=%270%27 stop-color=%27%230447ff%27/%3E%3Cstop offset=%271%27 stop-color=%27%23ff9ec0%27 stop-opacity=%270%27/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23ffc2d1%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27url(%23a)%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27url(%23b)%27/%3E%3C/svg%3E">
<meta name="description" content="Restaurantes y cafeterías de Medellín calificados en pareja.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<meta name="theme-color" content="#fdfcfc" id="theme-color">
<script>
(function(){var m=null;try{m=localStorage.getItem("mesa-tema");}catch(e){}
if(m!=="dark"&&m!=="light"){var h=document.documentElement.getAttribute("data-theme");m=h==="dark"||h==="light"?h:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
document.documentElement.setAttribute("data-mode",m);})();
</script>
<style>
/* Sistema: DESIGN.md "ElevenLabs" — lienzo crema, tinta negra, superficies taupe, titulares ligeros (300) y botones píldora negros.
   Violeta y naranja solo dentro de visuales (esferas de portada), nunca en controles.
   Layout: una columna móvil → 2 → 3 columnas; detalle en hoja inferior (móvil) o panel lateral (escritorio). Tema único claro. */
:root{
  --eggshell:#fdfcfc; --taupe:#f5f3f1; --stone:#ebe8e4; --btn-line:#e5e5e5;
  --ink:#000000; --graphite:#44403b; --smoke:#777169; --ash:#a59f97;
  --violet:#0447ff; --ember:#ff4704;
  --ok:#2f6b46; --danger:#b42318;
  --on-ink:#ffffff; --ink-hover:#262626; --halo:rgba(0,0,0,.075); --scrim:rgba(20,18,16,.32);
  --orb-a:#ffd9c7; --orb-b:#f3e9ff; --orb-icon:#ffffff;
  --font-display:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-card:20px; --r-lg:24px; --r-input:4px; --r-pill:9999px;
  --shadow-whisper:rgba(0,0,0,.4) 0 0 1px 0,rgba(0,0,0,.04) 0 1px 1px 0,rgba(0,0,0,.04) 0 2px 4px 0;
  --ease:cubic-bezier(.22,1,.36,1); --ease-sheet:cubic-bezier(.32,.72,0,1); --ease-in:cubic-bezier(.4,0,1,1);
  --t-fast:160ms; --t:240ms; --t-slow:380ms;
  --gutter:16px;
  color-scheme:light;
}
/* Modo oscuro: tinta cálida sobre negro tostado; mismas reglas (acentos solo en visuales) */
:root[data-mode="dark"]{
  --eggshell:#0f0e0d; --taupe:#1a1816; --stone:#2b2825; --btn-line:#34302c;
  --ink:#f4f1ec; --graphite:#d3cec7; --smoke:#a29c94; --ash:#6e6962;
  --ok:#74c495; --danger:#ff7b6c;
  --on-ink:#0f0e0d; --ink-hover:#dcd7d0; --halo:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.6);
  --orb-a:#3b2026; --orb-b:#1d1a33; --orb-icon:#1a1816;
  --shadow-whisper:rgba(255,255,255,.06) 0 0 0 1px inset,rgba(0,0,0,.5) 0 1px 2px 0;
  color-scheme:dark;
}
html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease),fill .35s,stroke .35s!important}
@media (min-width:720px){:root{--gutter:32px}}
@media (min-width:1100px){:root{--gutter:64px}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--eggshell);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--font-display);font-weight:300;letter-spacing:-.02em;font-feature-settings:"ss01"}
.mono{font-family:var(--font-mono);font-size:13px;letter-spacing:0;line-height:1.69}
.muted{color:var(--smoke)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:22px;height:22px}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--gutter)}

/* Botones (jerarquía única: negro relleno + contorno crema) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-pill);font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none;
  border:1px solid var(--btn-line);background:var(--eggshell);color:var(--ink);box-shadow:var(--shadow-whisper);
  transition:background-color var(--t) var(--ease),border-color var(--t),transform var(--t-fast) var(--ease),opacity var(--t)}
.btn:hover{background:var(--taupe)}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.fill:hover{background:var(--ink-hover)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--taupe)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--btn-line);background:var(--eggshell);box-shadow:var(--shadow-whisper);transition:background-color var(--t),transform var(--t-fast) var(--ease)}
.icon-btn:hover{background:var(--taupe)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.plain{box-shadow:none;border-color:transparent;background:transparent}
.icon-btn.plain:hover{background:var(--taupe)}

/* Navegación */
.topnav{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--eggshell) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color var(--t)}
.topnav.scrolled{border-bottom-color:var(--stone)}
.nav-row{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.wordmark .mk{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--ember),transparent 60%),radial-gradient(circle at 70% 70%,var(--violet),transparent 62%),#ffc2d1}
.nav-right{display:flex;align-items:center;gap:8px}
.mode{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 2px}
.mode .track{position:relative;width:56px;height:30px;border-radius:var(--r-pill);border:1px solid var(--btn-line);background:var(--taupe);transition:background-color var(--t) var(--ease),border-color var(--t)}
.mode .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--eggshell);box-shadow:var(--shadow-whisper);display:grid;place-items:center;transition:transform var(--t-slow) cubic-bezier(.34,1.4,.64,1),background-color var(--t)}
.mode .knob svg{position:absolute;width:14px;height:14px;transition:opacity var(--t) var(--ease),transform var(--t-slow) var(--ease)}
.mode .moon{opacity:0;transform:rotate(-90deg) scale(.6)}
.mode[aria-checked="true"] .knob{transform:translateX(26px)}
.mode[aria-checked="true"] .sun{opacity:0;transform:rotate(90deg) scale(.6)}
.mode[aria-checked="true"] .moon{opacity:1;transform:none}
.mode:hover .track{border-color:var(--ash)}
.tabs{display:flex;gap:6px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--btn-line);background:var(--eggshell);font-size:14px;font-weight:500;color:var(--graphite);transition:background-color var(--t),color var(--t),border-color var(--t)}
.tab:hover{background:var(--taupe)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--ember);transform:scale(0);transition:transform var(--t) var(--ease)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.tab[aria-current="page"] .dot{transform:scale(1)}
.tabs-desk{display:none}
.tabs-mobile{padding:10px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs-mobile::-webkit-scrollbar{display:none}
.add-label{display:none}
@media (min-width:860px){.tabs-desk{display:flex}.tabs-mobile{display:none}.add-label{display:inline}}

/* Hero editorial asimétrico */
.hero{display:grid;gap:20px;padding:28px 0 32px;border-bottom:1px solid var(--stone)}
.hero h1{font-size:36px;line-height:1.08}
.hero p{margin:0;color:var(--smoke);font-size:16px;max-width:46ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;text-transform:uppercase;color:var(--graphite)}
.facts b{font-weight:400;color:var(--ink)}
@media (min-width:860px){
  .hero{grid-template-columns:1.25fr 1fr;align-items:end;padding:56px 0 48px}
  .hero h1{font-size:48px}
}
.banner{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--r-card);background:var(--taupe);font-size:14px;color:var(--graphite)}

main.wrap{padding-top:28px;padding-bottom:96px}
.view{animation:viewIn var(--t-slow) var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}

/* Sugerencia (tarjeta grande taupe) */
.sugg{margin-bottom:28px}
.sugg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sugg-head .mono{text-transform:uppercase;color:var(--smoke)}
.sugg-nav{display:flex;gap:6px}
.sugg-nav .icon-btn{width:40px;height:40px}
.sugg-row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;padding-bottom:2px}
.sugg-row::-webkit-scrollbar{display:none}
.suggest{position:relative;isolation:isolate;overflow:hidden;flex:0 0 88%;scroll-snap-align:start;background:var(--taupe);border-radius:var(--r-lg);padding:24px;min-height:230px;display:flex;align-items:center;gap:16px}
.sugg-row.single .suggest{flex-basis:100%}
.suggest .txt{position:relative;z-index:1;flex:1;min-width:0}
.suggest.has-photo .txt{max-width:64%}
.suggest .eyebrow{text-transform:uppercase;color:var(--smoke)}
.suggest h2{font-size:30px;line-height:1.13;margin:6px 0 4px;overflow-wrap:anywhere}
.suggest .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.suggest .orb-wrap{flex:none;width:112px}
/* Con foto: la foto reemplaza el círculo y se funde con el fondo de la tarjeta (claro y oscuro) */
.suggest .ph{position:absolute;top:0;right:0;bottom:0;width:70%;z-index:0}
.suggest .ph img{width:100%;height:100%;object-fit:cover;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.06) 30%,rgba(0,0,0,.55) 62%,#000 88%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.06) 30%,rgba(0,0,0,.55) 62%,#000 88%);
  animation:phIn .6s var(--ease) both}
@keyframes phIn{from{opacity:0;transform:scale(1.04)}}
.suggest .ph .spin{position:absolute;right:24%;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:rot .8s linear infinite}
.suggest .ph-btn{position:absolute;top:14px;right:14px;z-index:2;background:color-mix(in srgb,var(--eggshell) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (min-width:720px){.suggest{flex-basis:calc(50% - 8px);padding:28px;min-height:250px}.suggest h2{font-size:34px}.suggest .orb-wrap{width:140px}.suggest .ph{width:66%}.suggest.has-photo .txt{max-width:56%}}

/* Filtros */
.filters{display:grid;gap:12px;margin-bottom:20px}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1px solid var(--stone);border-radius:var(--r-input);background:var(--eggshell);transition:border-color var(--t),box-shadow var(--t)}
.search:focus-within{border-color:var(--ink);box-shadow:var(--halo) 0 0 0 4px}
.search svg{color:var(--smoke)}
.search input{border:0;outline:none;background:transparent;width:100%;font-size:16px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--btn-line);background:var(--eggshell);font-size:14px;font-weight:500;color:var(--graphite);transition:background-color var(--t),color var(--t),border-color var(--t),transform var(--t-fast)}
.chip:hover{background:var(--taupe)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.vr{flex:none;width:1px;height:20px;background:var(--stone)}
.sel{flex:none;position:relative}
.sel select{appearance:none;-webkit-appearance:none;min-height:36px;padding:0 32px 0 14px;border-radius:var(--r-pill);border:1px solid var(--btn-line);background:var(--eggshell);font-size:14px;font-weight:500}
.sel svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;width:14px;height:14px;color:var(--smoke)}
@media (min-width:860px){.filters{grid-template-columns:minmax(260px,340px) 1fr;align-items:center}.chips{flex-wrap:wrap;overflow:visible}}

/* Tarjetas */
.grid{display:grid;gap:16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
.card{display:grid;gap:14px;align-content:start;text-align:left;width:100%;background:var(--taupe);border-radius:var(--r-card);padding:12px 12px 18px;transition:background-color var(--t) var(--ease),transform var(--t) var(--ease)}
.card:hover{background:var(--stone)}
.card:active{transform:scale(.985)}
.stagger .card,.stagger .rise{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.cover{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--eggshell);display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card:hover .cover img{transform:scale(1.03)}
.cover .badge{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--eggshell) 92%,transparent);color:var(--graphite)}
.cover .state{position:absolute;right:10px;top:10px;padding:2px 10px;border-radius:var(--r-pill);background:var(--eggshell);color:var(--ink);font-size:12px;font-weight:500}
.orb-wrap{position:relative;width:62%;aspect-ratio:1;display:grid;place-items:center}
.orb{position:absolute;inset:0;border-radius:50%;filter:saturate(1.05);-webkit-mask:radial-gradient(circle,#000 58%,transparent 71%);mask:radial-gradient(circle,#000 58%,transparent 71%)}
.orb-icon{position:relative;width:48px;height:48px;border-radius:50%;background:var(--orb-icon);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-whisper)}
.c-body{display:grid;gap:8px;padding:0 6px}
.c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.c-head h3{font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-.005em;overflow-wrap:anywhere}
.score{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.score b{font-family:var(--font-display);font-weight:300;font-size:26px;line-height:1;letter-spacing:-.02em}
.score svg{width:13px;height:13px;fill:var(--ink);stroke:none;transform:translateY(-1px)}
.meta{font-size:14px;color:var(--smoke);letter-spacing:.01em}
.people{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--graphite)}
.person{display:inline-flex;align-items:center;gap:6px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:0;background:var(--ink);color:var(--on-ink);flex:none}
.av.b{background:var(--stone);color:var(--ink)}
.quote{margin:0;font-size:15px;color:var(--graphite);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;padding:3px 10px;border-radius:var(--r-pill);border:1px solid var(--stone);color:var(--graphite);background:var(--eggshell)}
.tag.ex{border-style:dashed;color:var(--smoke)}

.empty{display:grid;justify-items:center;gap:12px;text-align:center;padding:48px 20px;border-radius:var(--r-card);background:var(--taupe);color:var(--smoke)}
.empty .orb-wrap{width:120px}
.empty b{font-family:var(--font-display);font-weight:300;font-size:28px;letter-spacing:-.02em;color:var(--ink)}
.skel{aspect-ratio:4/4.2;border-radius:var(--r-card);background:linear-gradient(90deg,var(--taupe),var(--stone),var(--taupe));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* Mapa */
.map-card{background:var(--taupe);border-radius:var(--r-lg);padding:16px;display:grid;gap:14px}
.map-card svg.map{width:100%;height:auto;max-height:72vh;display:block}
@media (min-width:860px){.map-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}}
.map-list{display:grid;gap:0;margin-top:16px}
@media (min-width:860px){.map-list{margin-top:0}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--graphite)}
.lg{display:inline-flex;align-items:center;gap:8px}
.lg i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pin{cursor:pointer;transform-box:fill-box;transform-origin:50% 50%;transition:transform var(--t) var(--ease)}
.pin:hover{transform:scale(1.18)}
.pin:focus-visible{outline:none}
.pin:focus-visible circle.ring{stroke-width:3}
.pins-in .pin{animation:pinIn .45s var(--ease) both;animation-delay:calc(var(--i)*35ms)}
@keyframes pinIn{from{opacity:0;transform:scale(.4)}}

/* Lista editorial (ranking, mapa) */
.row{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 4px;border-top:1px solid var(--stone);transition:background-color var(--t)}
.row:hover{background:var(--taupe)}
.row .n{font-family:var(--font-display);font-weight:300;font-size:28px;letter-spacing:-.02em;color:var(--ash);line-height:1}
.row b{font-weight:500}
.row .v{font-family:var(--font-display);font-weight:300;font-size:24px;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--stone);border-left:1px solid var(--stone);margin-bottom:40px}
.kpi{padding:18px 16px;border-right:1px solid var(--stone);border-bottom:1px solid var(--stone)}
.kpi b{display:block;font-family:var(--font-display);font-weight:300;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.kpi span{text-transform:uppercase;color:var(--smoke)}
@media (min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.sections{display:grid;gap:40px}
@media (min-width:860px){.sections{grid-template-columns:1fr 1fr;gap:40px 48px}}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-title h2{font-size:32px;line-height:1.13}
.vs{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--graphite)}
.track{position:relative;flex:1;height:2px;background:var(--stone);min-width:60px}
.track i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--eggshell)}

/* Hoja / panel */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.overlay[hidden]{display:none}
.overlay.enter{animation:fade var(--t) var(--ease) both}
.overlay.closing{animation:fadeOut 200ms var(--ease-in) both}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet{width:100%;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--eggshell);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-whisper)}
.overlay.enter .sheet{animation:up 420ms var(--ease-sheet) both}
.overlay.closing .sheet{animation:down 220ms var(--ease-in) both}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@media (min-width:860px){
  .overlay{justify-content:flex-end;align-items:stretch}
  .sheet{width:600px;max-height:none;height:100%;border-radius:var(--r-lg) 0 0 var(--r-lg)}
  .overlay.enter .sheet{animation:inR 400ms var(--ease-sheet) both}
  .overlay.closing .sheet{animation:outR 220ms var(--ease-in) both}
  .grab{display:none}
}
@keyframes inR{from{transform:translateX(100%)}}
@keyframes outR{to{transform:translateX(100%)}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--stone);margin:10px auto 0}
.sc.fwd{animation:fwd 280ms var(--ease) both}
.sc.back{animation:bk 280ms var(--ease) both}
@keyframes fwd{from{opacity:0;transform:translateX(16px)}}
@keyframes bk{from{opacity:0;transform:translateX(-16px)}}
.sh-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--eggshell) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--stone)}
.sh-head .t{flex:1;min-width:0;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{padding:20px 16px 32px;display:grid;gap:28px}
@media (min-width:720px){.sh-body{padding:24px 32px 40px}.sh-head{padding:12px 24px}}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-card)}
.gallery::-webkit-scrollbar{display:none}
.gallery button{flex:0 0 86%;scroll-snap-align:start;aspect-ratio:4/3;border-radius:var(--r-card);overflow:hidden;background:var(--taupe)}
.gallery button:only-child{flex-basis:100%}
.gallery img{width:100%;height:100%;object-fit:cover}
.cover-lg{aspect-ratio:16/10;border-radius:var(--r-card);background:var(--taupe);display:grid;place-items:center;overflow:hidden}
.cover-lg .orb-wrap{width:44%}
.d-title h2{font-size:32px;line-height:1.13}
.d-title .meta{margin-top:8px;display:grid;gap:4px}
.d-title .meta span{display:flex;align-items:center;gap:8px}
.d-score{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--stone);border-bottom:1px solid var(--stone)}
.d-score .big{font-family:var(--font-display);font-weight:300;font-size:56px;line-height:.95;letter-spacing:-.02em}
.d-score .lbl{text-transform:uppercase;color:var(--smoke);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .grow{flex:1 1 160px}
.block-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.block-title h3{font-family:var(--font-display);font-weight:300;font-size:24px;letter-spacing:-.02em}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:720px){.photos{grid-template-columns:repeat(4,1fr)}}
.photos button,.photos .up{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--taupe)}
.photos img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.photos button:hover img{transform:scale(1.04)}
.photos .up{display:grid;place-items:center;color:var(--smoke)}
.photos .up img{opacity:.55}
.photos .up .spin{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid var(--stone);border-top-color:var(--ink);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.drop{display:grid;justify-items:center;gap:6px;padding:20px;border:1px dashed var(--ash);border-radius:var(--r-card);color:var(--smoke);text-align:center;font-size:14px;transition:background-color var(--t),border-color var(--t)}
.drop:hover,.drop.over{background:var(--taupe);border-color:var(--ink)}
.drop b{color:var(--ink);font-weight:500}
.crit{display:grid;gap:14px}
.crit-row{display:grid;gap:6px}
.crit-row .lbl{font-size:14px;font-weight:500}
.bar-line{display:grid;grid-template-columns:24px 1fr 20px;gap:10px;align-items:center;font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--stone);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ink);transform-origin:left;transform:scaleX(var(--v))}
.bar.b i{background:var(--ash)}
.anim .bar i{animation:grow .7s var(--ease) both;animation-delay:calc(var(--k)*50ms + 100ms)}
@keyframes grow{from{transform:scaleX(0)}}
.review{display:grid;gap:10px;padding:18px 0;border-top:1px solid var(--stone)}
.rv-head{display:flex;align-items:center;gap:10px}
.rv-head .who{flex:1;min-width:0}
.rv-head .who b{font-weight:500;display:block;font-size:15px}
.stars{display:inline-flex;gap:1px;vertical-align:-1px}
.stars svg{width:12px;height:12px;stroke:none;fill:var(--stone)}
.stars svg.on{fill:var(--ink)}
.review p{margin:0;color:var(--graphite)}
.order{font-size:14px;color:var(--graphite)}
.order b{font-weight:500;color:var(--ink)}
.ret{font-size:12px;font-weight:500;padding:3px 10px;border-radius:var(--r-pill);border:1px solid var(--stone)}
.ret.si{color:var(--ok)} .ret.no{color:var(--danger)} .ret.quizas{color:var(--graphite)}

/* Formularios */
form.f{display:grid;gap:22px}
.field{display:grid;gap:8px}
.field>label,.field .lbl{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--stone);border-radius:var(--r-input);background:var(--eggshell);font-size:16px;transition:border-color var(--t),box-shadow var(--t)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);box-shadow:var(--halo) 0 0 0 4px}
.field textarea{min-height:110px;resize:vertical}
.hint{font-size:13px;color:var(--smoke)}
.row2{display:grid;gap:16px}
@media (min-width:600px){.row2{grid-template-columns:1fr 1fr}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{min-height:40px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--btn-line);background:var(--eggshell);font-size:14px;font-weight:500;color:var(--graphite);display:inline-flex;align-items:center;gap:8px;transition:background-color var(--t),color var(--t),border-color var(--t),transform var(--t-fast)}
.pills button:hover{background:var(--taupe)}
.pills button:active{transform:scale(.97)}
.pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.rate{border-top:1px solid var(--stone)}
.star-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--stone)}
.star-row .lbl{font-size:15px;font-weight:500}
.star-in{display:flex}
.star-in button{width:40px;height:44px;display:grid;place-items:center;color:var(--stone);transition:color var(--t-fast)}
.star-in button svg{width:24px;height:24px;fill:currentColor;stroke:none;transition:transform var(--t) var(--ease)}
.star-in button.on{color:var(--ink)}
.star-in button:hover svg{transform:scale(1.1)}
.star-in button.pop svg{animation:pop .35s var(--ease)}
@keyframes pop{50%{transform:scale(1.25)}}
.overall{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 2px}
.overall b{font-family:var(--font-display);font-weight:300;font-size:40px;letter-spacing:-.02em;line-height:1}
.overall b.bump{animation:pop .35s var(--ease)}
.pending-photos{display:flex;gap:6px;flex-wrap:wrap}
.pending-photos span{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--taupe)}
.pending-photos img{width:100%;height:100%;object-fit:cover}
.pending-photos button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.pending-photos button svg{width:12px;height:12px}
.foot{position:sticky;bottom:0;display:flex;gap:8px;padding:14px 0 calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--eggshell) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--stone)}
.foot .btn.fill{flex:1}

/* Visor de fotos */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(10,9,8,.94);display:grid;grid-template-rows:auto 1fr auto;color:#fff}
.viewer[hidden]{display:none}
.viewer.enter{animation:fade var(--t) var(--ease) both}
.viewer .vt{display:flex;align-items:center;gap:10px;padding:10px 12px}
.viewer .vt .grow{flex:1;min-width:0;font-size:14px}
.viewer .stage{position:relative;display:grid;place-items:center;padding:0 8px;min-height:0;touch-action:pan-y}
.viewer .stage img{max-height:100%;max-width:100%;object-fit:contain;border-radius:8px;animation:imgIn var(--t-slow) var(--ease)}
@keyframes imgIn{from{opacity:0;transform:scale(.98)}}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.viewer .nav:hover{background:rgba(255,255,255,.22)}
.viewer .prev{left:12px}.viewer .next{right:12px}
.viewer .vb{padding:12px;text-align:center;font-size:13px;color:rgba(255,255,255,.7)}
.viewer .vbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.viewer .vbtn:hover{background:rgba(255,255,255,.12)}
.viewer .del.armed{width:auto;padding:0 14px;border-radius:999px;background:var(--danger);font-size:14px;font-weight:500}

.me-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding-bottom:40px;margin-top:-56px;color:var(--smoke);text-transform:uppercase}
.me-line b{font-weight:400;color:var(--ink)}
.me-line .btn{text-transform:none;font-family:var(--font-body);letter-spacing:.01em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--r-pill);background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-whisper)}
.toast[hidden]{display:none}
.toast.show{animation:toastIn .35s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important;scroll-behavior:auto!important}}

/* ---------- Secciones: Mesa para Dos / Recetario L&S ---------- */
.secbar{border-bottom:1px solid var(--stone);background:var(--eggshell)}
.secbar .wrap{display:flex;gap:24px;height:40px;align-items:stretch}
.sec{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--smoke);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--t),border-color var(--t)}
.sec:hover{color:var(--ink)}
.sec[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.sec svg{width:14px;height:14px}

/* Avatares de invitados */
.av.g{background:transparent;color:var(--graphite);box-shadow:inset 0 0 0 1px var(--ash)}

/* Selector de cocinas */
.coc-add{display:flex;gap:8px;margin-top:4px}
.coc-add input{flex:1;min-width:0;min-height:40px;padding:8px 12px;border:1px solid var(--stone);border-radius:var(--r-input);background:var(--eggshell);font-size:15px}
.coc-add input:focus{outline:none;border-color:var(--ink);box-shadow:var(--halo) 0 0 0 4px}

/* Filtros del ranking */
.rank-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:24px}
.rank-filters .lbl{display:inline-flex;align-items:center;gap:6px;color:var(--smoke);text-transform:uppercase;margin-right:4px}
.rank-filters .count{margin-left:auto;color:var(--smoke)}
.sel.on select{border-color:var(--ink);background:var(--taupe)}

/* Mapa real (Leaflet) */
.map-real{height:460px;border-radius:var(--r-card);overflow:hidden;background:var(--taupe);z-index:0}
@media (min-width:860px){.map-real{height:560px}}
.map-fallback{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--smoke);font-size:14px}
.leaflet-container{font-family:var(--font-body);background:var(--taupe)}
.leaflet-control-zoom a{background:var(--eggshell)!important;color:var(--ink)!important;border-color:var(--stone)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--eggshell) 85%,transparent)!important;color:var(--smoke)!important}
.leaflet-control-attribution a{color:var(--graphite)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--eggshell);color:var(--ink);box-shadow:var(--shadow-whisper);border-radius:14px}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.4}
.leaflet-popup-content b{font-weight:500;font-size:15px}
.leaflet-popup-content .btn{margin-top:10px;min-height:34px;padding:0 14px}
.mk-wrap{background:none;border:0}
.mpin{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font:500 11px/1 var(--font-body);background:var(--ink);color:var(--on-ink);border:2px solid var(--eggshell);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform var(--t) var(--ease)}
.mpin.cafe{background:var(--eggshell);color:var(--ink);border-color:var(--ink)}
.mpin.todo{background:var(--eggshell);color:var(--ink);border:2px dashed var(--ink)}
.mpin:hover{transform:scale(1.15)}
/* Modo oscuro: el mismo mapa de OpenStreetMap, invertido y suavizado */
:root[data-mode="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55)}

/* Selector de ubicación en el formulario */
.pick-map{height:220px;border-radius:12px;overflow:hidden;background:var(--taupe);margin-top:8px}
.geo-row{display:flex;gap:8px}
.geo-row input{flex:1;min-width:0}
.geo-results{display:grid;gap:0;border:1px solid var(--stone);border-radius:var(--r-input);overflow:hidden;margin-top:6px}
.geo-results button{text-align:left;padding:10px 12px;font-size:14px;border-top:1px solid var(--stone);background:var(--eggshell)}
.geo-results button:first-child{border-top:0}
.geo-results button:hover{background:var(--taupe)}
.loc-state{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--smoke);margin-top:6px}
.loc-state b{color:var(--ink);font-weight:500}

/* Visitas */
.person-block{display:grid;gap:0;border-top:1px solid var(--stone);padding-top:14px;margin-top:6px}
.person-block:first-of-type{border-top:0;margin-top:0;padding-top:0}
.pb-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.pb-head b{font-weight:500;flex:1}
.visit{display:grid;gap:8px;padding:12px 0 12px 34px;border-top:1px dashed var(--stone)}
.visit:first-of-type{border-top:0}
.visit-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.visit-head .grow{flex:1}
.visit p{margin:0;color:var(--graphite)}
.edit-link{font-size:13px;font-weight:500;color:var(--graphite);text-decoration:underline;text-underline-offset:3px;min-height:32px}
.cnt{font-size:12px;color:var(--smoke)}

/* Portada */
.photos .cover-tag{position:absolute;left:6px;top:6px;padding:1px 8px;border-radius:var(--r-pill);background:var(--eggshell);color:var(--ink);font-size:11px;font-weight:500}
.viewer .vbtn.cov{width:auto;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;gap:6px;display:inline-flex;align-items:center}
.viewer .vbtn.cov.is{background:rgba(255,255,255,.16)}

/* Recetario */
.prep{white-space:pre-wrap;color:var(--graphite);margin:0;line-height:1.65}
.audio-box{display:grid;gap:8px;padding:14px;border-radius:var(--r-card);background:var(--taupe)}
.audio-box audio{width:100%}
.rec-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.level{display:inline-flex;gap:3px;vertical-align:middle}
.level i{width:7px;height:7px;border-radius:50%;background:var(--stone)}
.level i.on{background:var(--ink)}
.price-in{display:flex;align-items:center;border:1px solid var(--stone);border-radius:var(--r-input);background:var(--eggshell);padding-left:12px;transition:border-color var(--t),box-shadow var(--t)}
.price-in:focus-within{border-color:var(--ink);box-shadow:var(--halo) 0 0 0 4px}
.price-in span{color:var(--smoke)}
.field .price-in input{border:0;box-shadow:none!important;padding-left:6px}
.who-other{display:flex;gap:8px;margin-top:12px}
.who-other input{flex:1;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--stone);border-radius:var(--r-input);background:var(--eggshell);font-size:16px}

[hidden]{display:none!important}
.sheet{overflow-x:hidden}
.sh-body>*{min-width:0}
.who-other input{width:100%}
.who-other .btn{flex:none}
.d-score .big.none{color:var(--ash)}
</style>
</head>
<body>
<div class="secbar"><div class="wrap" id="secbar"></div></div>
<header class="topnav" id="topnav">
  <div class="wrap nav-row">
    <a class="wordmark" href="#" data-view="home"><span class="mk" aria-hidden="true"></span><span id="wm-text">Mesa para Dos</span></a>
    <nav class="tabs tabs-desk" id="tabs-desk" aria-label="Vistas"></nav>
    <div class="nav-right">
    <button class="mode" id="mode-switch" role="switch" aria-checked="false" aria-label="Modo oscuro" title="Modo oscuro">
      <span class="track"><span class="knob"><svg class="i sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg class="i moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span></span>
    </button>
    <button class="btn fill" id="add-btn" data-action="new-item" aria-label="Agregar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="add-label" id="add-label">Agregar lugar</span></button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <h1 class="display" id="hero-title">Los lugares que vamos descubriendo juntos.</h1>
    <div>
      <p id="hero-text">Restaurantes y cafeterías de Medellín, calificados por los dos. Cada uno pone su nota, sus fotos y lo que hay que pedir.</p>
      <div class="facts mono" id="facts"></div>
    </div>
  </section>
  <div id="banner"></div>
  <nav class="tabs tabs-mobile" id="tabs-mobile" aria-label="Vistas"></nav>
</div>

<main class="wrap" id="main"></main>
<footer class="wrap me-line mono" id="me-line"></footer>

<input type="file" id="file-in" accept="image/*" multiple hidden>
<input type="file" id="audio-in" accept="audio/*" hidden>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle"></div></div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Foto"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const P={

function groups(kind,id){
  const m={};
  revs(kind,id).forEach(r=>{(m[r.by]=m[r.by]||[]).push(r);});

    .sort((a,b)=>personOrder(a.by)-personOrder(b.by)||(a.by<b.by?-1:1));
}

  const sig=JSON.stringify([d.places,d.reviews,d.photos,d.recipes,d.recipeReviews]);
  const changed=sig!==lastSig;lastSig=sig;
  places=d.places||[];reviews=d.reviews||[];photos=d.photos||[];recipes=d.recipes||[];recipeReviews=d.recipeReviews||[];
  [...reviews,...recipeReviews].forEach(r=>{if(r.byName&&isGuest(r.by))names[r.by]=r.byName;});

}

function upsertLocal(coll,doc){const arr=LISTS[coll]();const i=arr.findIndex(x=>x.id===doc.id);i>=0?arr[i]=doc:arr.push(doc);}
function removeLocal(coll,id){const arr=LISTS[coll]();const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);}

async function uploadBlob(blob){
  if(mode!=="live")return URL.createObjectURL(blob);
  const r=await fetch("api/upload",{method:"POST",headers:{"content-type":(blob.type||"image/jpeg").split(";")[0],"x-mesa-pin":pin},body:blob});
  const out=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(out.error||"No se pudo subir el archivo");
  return out.url;
}

/* ---------- Fotos ---------- */
const canUpload=()=>canCreate();
async function compress(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    const max=1600,s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;
    cv.getContext("2d").drawImage(bmp,0,0,w,h);bmp.close?.();
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.82));
    return blob?{blob,w,h}:{blob:file,w:0,h:0};
  }catch(_){return {blob:file,w:0,h:0};}
}
async function uploadPhotos(id,files){
  files=[...files].filter(f=>f.type.startsWith("image/")).slice(0,12);
  if(!files.length)return;
  const list=uploading[id]=uploading[id]||[];
  const tmps=files.map(f=>({tmp:uid(),url:URL.createObjectURL(f)}));
  list.push(...tmps);render();
  let ok=0;
  for(let i=0;i<files.length;i++){
    try{
      const {blob,w,h}=await compress(files[i]);
      const url=await uploadBlob(blob);
      const row={id:uid(),placeId:id,by:me,w,h,createdAt:Date.now(),url};
      if(mode==="live")await api("POST",{op:"set",coll:"photos",id:row.id,data:row});
      photos.push(row);ok++;
    }catch(err){toast(err.message||"No se pudo subir una foto","x");}
    const k=list.indexOf(tmps[i]);if(k>=0)list.splice(k,1);
    URL.revokeObjectURL(tmps[i].url);render();
  }
  if(ok)toast(ok===1?"Foto agregada":`${ok} fotos agregadas`,"image");
}

/* ---------- Mapa (Leaflet + OpenStreetMap) ---------- */
function tileLayer(){
  return L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
}
function setTiles(){
  if(typeof L==="undefined")return;
  [map,pickMap].forEach(m=>{if(!m)return;m.eachLayer(l=>{if(l instanceof L.TileLayer)m.removeLayer(l);});tileLayer().addTo(m);});
}
function coordsOf(p){
  if(typeof p.lat==="number"&&typeof p.lng==="number")return [p.lat,p.lng];
  const c=(ZONAS[p.zona]||ZONAS.otra).c,h=hash(p.id);
  return [c[0]+((h%100)-50)/8000,c[1]+(((h>>8)%100)-50)/8000];
}
function nearestZone(lat,lng){
  let best="otra",d=Infinity;
  for(const [k,z] of Object.entries(ZONAS)){if(k==="otra")continue;const dd=(z.c[0]-lat)**2+(z.c[1]-lng)**2;if(dd<d){d=dd;best=k;}}
  return Math.sqrt(d)<0.06?best:"otra";
}
function mountMap(){
  const el=$("#map");
  if(!el){if(map){mapState={c:map.getCenter(),z:map.getZoom()};map.remove();map=null;}return;}
  if(typeof L==="undefined"){el.innerHTML=`<div class="map-fallback">No se pudo cargar el mapa. Revisa tu conexión e intenta de nuevo.</div>`;return;}
  if(map){mapState={c:map.getCenter(),z:map.getZoom()};map.remove();map=null;}
  map=L.map(el,{scrollWheelZoom:true});
  tileLayer().addTo(map);
  const pts=[];
  places.forEach(p=>{
    const c=coordsOf(p);pts.push(c);
    const sc=score("place",p.id),cls=sc==null?"todo":(p.tipo==="cafeteria"?"cafe":"");
    const icon=L.divIcon({className:"mk-wrap",html:`<span class="mpin ${cls}">${sc==null?"?":fmt(sc)}</span>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-16]});
    const mk=L.marker(c,{icon,title:p.nombre,keyboard:true}).addTo(map);
    mk.bindPopup(`<b>${esc(p.nombre)}</b><br><span class="meta">${typeLabel(p)} · ${esc(zonaN(p))}${sc!=null?" · "+fmt(sc)+" ★":""}</span><br><button class="btn fill sm" data-popup-open="${p.id}">Ver lugar</button>`);
    mk.on("popupopen",e=>{e.popup.getElement()?.querySelector("[data-popup-open]")?.addEventListener("click",()=>openItem("place",p.id));});
  });
  if(mapState)map.setView(mapState.c,mapState.z);
  else if(pts.length)map.fitBounds(pts,{padding:[40,40],maxZoom:14});
  else map.setView(ZONAS.otra.c,12);
}
function mountPickMap(){
  const el=$("#pick-map");
  if(pickMap){pickMap.remove();pickMap=null;}
  if(!el||!placeDraft)return;
  if(typeof L==="undefined"){el.innerHTML=`<div class="map-fallback">No se pudo cargar el mapa.</div>`;return;}
  const has=typeof placeDraft.lat==="number";
  const c=has?[placeDraft.lat,placeDraft.lng]:(ZONAS[placeDraft.zona]||ZONAS.otra).c;
  pickMap=L.map(el,{scrollWheelZoom:false}).setView(c,has?16:13);
  tileLayer().addTo(pickMap);
  let mk=has?L.marker(c,{draggable:true}).addTo(pickMap):null;
  const setPos=(lat,lng)=>{placeDraft.lat=+lat.toFixed(6);placeDraft.lng=+lng.toFixed(6);placeDraft.zona=nearestZone(lat,lng);
    if(!mk){mk=L.marker([lat,lng],{draggable:true}).addTo(pickMap);mk.on("dragend",()=>{const q=mk.getLatLng();setPos(q.lat,q.lng);});}else mk.setLatLng([lat,lng]);
    const st=$("#loc-state");if(st)st.innerHTML=locStateHtml();const z=$("#pf-zona");if(z)z.value=placeDraft.zona;};
  if(mk)mk.on("dragend",()=>{const q=mk.getLatLng();setPos(q.lat,q.lng);});
  pickMap.on("click",e=>setPos(e.latlng.lat,e.latlng.lng));
  mountPickMap.setPos=setPos;
}
const locStateHtml=()=>typeof placeDraft?.lat==="number"?`${ic("pin")}<span><b>Ubicación marcada.</b> Toca el mapa o arrastra el punto para ajustarla.</span>`:`${ic("pin")}<span>Busca la dirección, toca el mapa o usa tu ubicación.</span>`;
async function geoSearch(q){

function filtered(){
  const q=filt.q.trim().toLowerCase();
  let arr=places.filter(p=>{
    if(filt.tipo!=="todos"&&p.tipo!==filt.tipo)return false;
    if(filt.estado!=="todos"&&p.estado!==filt.estado)return false;
    if(filt.zona!=="todas"&&p.zona!==filt.zona)return false;
    if(q){const hay=[p.nombre,...cocinasOf(p),p.direccion,zonaN(p),...(p.tags||[]),...revs("place",p.id).map(r=>(r.comentario||"")+" "+(r.pedir||""))].join(" ").toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  const s=p=>score("place",p.id)??-1;
  if(filt.orden==="puntaje")arr.sort((a,b)=>s(b)-s(a));
  else if(filt.orden==="reciente")arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else arr.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  return arr;
}

const PRICE2=[["todos","Cualquier precio"],["30","Hasta $30.000"],["60","$30.000 – $60.000"],["mas","Más de $60.000"]];
const passPrice2=(v,f)=>f==="todos"||(f==="30"?(v&&v<=30000):f==="60"?(v>30000&&v<=60000):v>60000);
function recipeMeta(r){return [cocinasOf(r).join(", "),r.facilidad?FACIL[r.facilidad]:"",r.precio2?money(r.precio2)+" para 2":""].filter(Boolean).map(esc).join(" · ");}
function viewRecipes(){
  const cocs=[...new Set(recipes.flatMap(cocinasOf))].sort((a,b)=>a.localeCompare(b,"es"));
  const q=rf.q.trim().toLowerCase();
  let arr=recipes.filter(r=>(rf.cocina==="todas"||cocinasOf(r).includes(rf.cocina))&&(rf.facilidad==="todas"||r.facilidad===rf.facilidad)&&(!q||[r.nombre,...cocinasOf(r),r.preparacion].join(" ").toLowerCase().includes(q)));
  const s=r=>score("recipe",r.id)??-1;
  if(rf.orden==="puntaje")arr.sort((a,b)=>s(b)-s(a));else if(rf.orden==="reciente")arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));else if(rf.orden==="facil")arr.sort((a,b)=>(FACIL_N[a.facilidad]||9)-(FACIL_N[b.facilidad]||9));else arr.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  const head=`<div class="filters">
    <label class="search" for="rq">${ic("search")}<span class="sr">Buscar</span><input id="rq" type="search" autocomplete="off" placeholder="Buscar receta, cocina o ingrediente" value="${esc(rf.q)}"></label>
    <div class="chips" role="group" aria-label="Filtros">
      ${chip("data-rf-fac","todas","Todas",rf.facilidad)}${chip("data-rf-fac","facil","Fáciles",rf.facilidad)}${chip("data-rf-fac","media","Media",rf.facilidad)}${chip("data-rf-fac","dificil","Difíciles",rf.facilidad)}
      <span class="vr" aria-hidden="true"></span>
      ${sel("rf-cocina","Cocina",[["todas","Todas las cocinas"],...cocs.map(c=>[c,c])],rf.cocina)}
      ${sel("rf-orden","Ordenar",[["puntaje","Mejor puntaje"],["reciente","Más recientes"],["facil","Más fáciles"],["nombre","A–Z"]],rf.orden)}
    </div></div>`;
  if(!recipes.length)return head+emptyState("Aún no hay recetas","Guarden su primer plato: cómo se prepara, cuánto cuesta y cómo les quedó.","Agregar receta");
  if(!arr.length)return head+emptyState("Nada por aquí","Ninguna receta coincide con esos filtros.");
  return head+`<div class="grid ${animNext&&!reduced?"stagger":""}">${arr.map(recipeCard).join("")}</div>`;
}
function recipeCard(r,i){

/* ---------- Hoja ---------- */
let closeT=null,lastFocus=null;
function openSheet(html,{quiet=false,dir="fwd",label="Detalle"}={}){
  const ov=$("#overlay"),sh=$("#sheet");
  clearTimeout(closeT);
  const wasOpen=!ov.hidden&&!ov.classList.contains("closing");
  ov.classList.remove("closing");
  const keep=quiet?sh.scrollTop:0;
  if(pickMap){pickMap.remove();pickMap=null;}
  sh.setAttribute("aria-label",label);
  sh.innerHTML=`<div class="grab" aria-hidden="true"></div><div class="sc ${wasOpen&&!quiet?dir:""} ${quiet?"":"anim"}">${html}</div>`;
  sh.scrollTop=keep;
  if(!wasOpen){
    lastFocus=document.activeElement;
    ov.hidden=false;ov.classList.remove("enter");void ov.offsetWidth;ov.classList.add("enter");
    document.body.style.overflow="hidden";
    setTimeout(()=>(sh.querySelector("[data-autofocus]")||sh.querySelector(".sh-head button"))?.focus({preventScroll:true}),60);
  }
}
function closeSheet(force){
  if(sheetMode==="gate"&&!force)return;
  if(rec)stopRec(true);
  const ov=$("#overlay");
  openId=null;openKind=null;draft=null;placeDraft=null;recipeDraft=null;confirmDel=null;sheetMode=null;pendingFiles=[];geoResults=[];
  if(pickMap){pickMap.remove();pickMap=null;}
  if(ov.hidden)return;
  ov.classList.remove("enter");ov.classList.add("closing");
  document.body.style.overflow="";
  closeT=setTimeout(()=>{ov.hidden=true;ov.classList.remove("closing");$("#sheet").innerHTML="";},reduced?0:220);
  lastFocus?.focus?.({preventScroll:true});
}
const closeBtn=`<button class="icon-btn plain" data-action="close" aria-label="Cerrar">${ic("x")}</button>`;
const backBtn=`<button class="icon-btn plain" data-action="back" aria-label="Volver">${ic("back")}</button>`;
function openItem(kind,id){
  const it=itemById(id);if(!it)return;
  openId=id;openKind=kind;draft=null;placeDraft=null;recipeDraft=null;confirmDel=null;pendingFiles=[];
  kind==="recipe"?renderRecipeDetail(it):renderDetail(it);

function photosBlock(item){

function scoreBlock(kind,id){

function rateButton(kind,id){

function compareBlock(kind,id){

function reviewsBlock(kind,id,emptyMsg){

const stars=n=>{const r=Math.round(n||0);return `<span class="stars" aria-label="${fmt(n)} de 5">${[1,2,3,4,5].map(i=>`<svg viewBox="0 0 24 24" class="${i<=r?"on":""}" aria-hidden="true">${P.star}</svg>`).join("")}</span>`;};

/* ---------- Grabación de audio ---------- */
async function startRec(){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast("Este navegador no permite grabar. Usa “Subir un audio”.","x");return;}
  syncRecipeDraft();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg"].find(t=>MediaRecorder.isTypeSupported?.(t))||"";
    const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:48000}:{audioBitsPerSecond:48000});
    rec={mr,chunks:[],start:Date.now(),stream,discard:false};
    mr.ondataavailable=e=>{if(e.data.size)rec.chunks.push(e.data);};
    mr.onstop=()=>{
      const r0=rec;rec=null;clearInterval(r0.timer);r0.stream.getTracks().forEach(t=>t.stop());
      if(r0.discard||!recipeDraft)return;
      const type=(mr.mimeType||"audio/webm").split(";")[0];
      const blob=new Blob(r0.chunks,{type});
      recipeDraft.newAudio={blob,url:URL.createObjectURL(blob),dur:Math.round((Date.now()-r0.start)/1000),mime:type};
      recipeDraft.removeAudio=false;
      renderRecipeForm({quiet:true});
    };
    mr.start(1000);
    rec.timer=setInterval(()=>{if(!rec)return;const el=$("#rec-time");if(el)el.textContent=mmss((Date.now()-rec.start)/1000);if(Date.now()-rec.start>8*60e3)stopRec();},500);
    renderRecipeForm({quiet:true});
  }catch(e){rec=null;toast("No se pudo usar el micrófono. Revisa los permisos del navegador.","x");}
}
function stopRec(discard){if(!rec)return;rec.discard=!!discard;try{rec.mr.stop();}catch(_){}}

  if(a==="suggest-photo"){suggestPid=d.pid;fileTarget="suggest";$("#file-in").multiple=false;$("#file-in").click();return;}
  if(a==="pick-photos"){$("#file-in").multiple=true;fileTarget=sheetMode==="detail"?"detail":sheetMode;syncAnyDraft();$("#file-in").click();return;}
  if(a==="back"){if(rec)stopRec(true);draft=null;placeDraft=null;recipeDraft=null;confirmDel=null;pendingFiles=[];geoResults=[];const it=itemById(openId);if(it)openKind==="recipe"?renderRecipeDetail(it,{dir:"back"}):renderDetail(it,{dir:"back"});else closeSheet();return;}
  if(a==="new-item"){if(!canCreate())return;openId=null;pendingFiles=[];geoResults=[];
    if(section==="mesa"){openKind="place";placeDraft={id:uid(),nombre:"",tipo:"restaurante",cocinas:[],precio:2,zona:"otra",estado:"por-probar",direccion:"",mapsUrl:"",tags:[]};renderPlaceForm();}
    else{openKind="recipe";recipeDraft={id:"rec-"+uid(),nombre:"",cocinas:[],facilidad:"media",precio2:0,preparacion:""};renderRecipeForm();}
    return;}
  if(a==="edit-item"){const it=itemById(openId);if(!it)return;confirmDel=null;pendingFiles=[];geoResults=[];
    if(openKind==="recipe"){recipeDraft={...it,cocinas:[...cocinasOf(it)]};renderRecipeForm();}else{placeDraft={...it,cocinas:[...cocinasOf(it)],tags:[...(it.tags||[])]};renderPlaceForm();}return;}
  if(a==="review"){if(!me)return;draft=newReviewDraft(openKind,openId);confirmDel=null;pendingFiles=[];renderReviewForm();return;}
  if(a==="del-item"){if(confirmDel!=="item"){confirmDel="item";refreshDetail();return;}
    const id=openId,kind=openKind;closeSheet();try{await removeItem(kind,id);toast(kind==="recipe"?"Receta eliminada":"Lugar eliminado","trash");}catch(err){toast("No se pudo eliminar. Revisa tu conexión.","x");}return;}
  if(a==="del-review"){syncDraft();if(confirmDel!=="review"){confirmDel="review";renderReviewForm({quiet:true});return;}
    const rid=draft.id,coll=KINDS[draft.kind].coll;draft=null;confirmDel=null;try{await delDoc(coll,rid);toast("Reseña borrada","trash");}catch(err){toast("No se pudo borrar la reseña.","x");}refreshAfterForm();return;}
  if(a==="clear-examples"){if(confirmDel!=="examples"){confirmDel="examples";render();return;}
    confirmDel=null;try{if(section==="mesa"){for(const p of places.filter(p=>p.ejemplo))await removeItem("place",p.id);}else{for(const r of recipes.filter(r=>r.ejemplo))await removeItem("recipe",r.id);}toast("Ejemplos borrados","trash");}catch(err){toast("No se pudieron borrar todos los ejemplos.","x");}animNext=true;render();return;}
});
function refreshAfterForm(){const it=itemById(openId);if(it)openKind==="recipe"?renderRecipeDetail(it,{dir:"back"}):renderDetail(it,{dir:"back"});else closeSheet();}
function addCocina(){
  const inp=$("#coc-new");const v=(inp?.value||"").trim().replace(/\s+/g," ");if(!v)return;
  const name=v.charAt(0).toUpperCase()+v.slice(1);
  syncAnyDraft();const dr=sheetMode==="place"?placeDraft:recipeDraft;
  const existing=allCocinas(dr.cocinas).find(c=>c.toLowerCase()===name.toLowerCase())||name;
  dr.cocinas=[...new Set([...(dr.cocinas||[]),existing])];rerenderForm();
  setTimeout(()=>$("#coc-new")?.focus(),30);
}

/* ---------- Envíos ---------- */
document.addEventListener("submit",async e=>{
  if(e.target.id==="pin-form")return;
  e.preventDefault();
  const btn=e.target.querySelector('button[type="submit"]');
  if(e.target.id==="place-form"){
    syncPlaceDraft();
    if(!placeDraft.nombre.trim()){toast("Escribe el nombre del lugar","x");$("#pf-nombre").focus();return;}
    const isNew=!places.some(x=>x.id===placeDraft.id);
    const p={...placeDraft,nombre:placeDraft.nombre.trim(),cocina:(placeDraft.cocinas||[]).join(", "),createdAt:placeDraft.createdAt||Date.now()};
    if(isNew&&me)p.createdBy=me;
    btn.disabled=true;
    try{await putDoc("places",p);openId=p.id;openKind="place";placeDraft=null;toast(isNew?"Lugar agregado":"Cambios guardados");if(isNew)animNext=true;flushPending(p.id);renderDetail(itemById(p.id)||p,{dir:"back"});}
    catch(err){btn.disabled=false;toast("No se pudo guardar. Revisa tu conexión.","x");}
  }
  if(e.target.id==="recipe-form"){
    syncRecipeDraft();
    if(!recipeDraft.nombre.trim()){toast("Escribe el nombre del plato","x");$("#rf-nombre").focus();return;}
    const isNew=!recipes.some(x=>x.id===recipeDraft.id);
    const {newAudio,removeAudio,...rest}=recipeDraft;
    const r={...rest,nombre:rest.nombre.trim(),cocina:(rest.cocinas||[]).join(", "),createdAt:rest.createdAt||Date.now()};
    if(isNew&&me)r.createdBy=me;
    btn.disabled=true;btn.textContent=newAudio?"Subiendo audio…":"Guardando…";
    try{
      if(removeAudio&&!newAudio)delete r.audio;
      if(newAudio){const url=await uploadBlob(newAudio.blob);r.audio={url,mime:newAudio.mime,dur:newAudio.dur,by:me,createdAt:Date.now()};if(mode!=="live")r.audio.localUrl=url;}
      await putDoc("recipes",r);openId=r.id;openKind="recipe";recipeDraft=null;toast(isNew?"Receta agregada":"Cambios guardados");if(isNew)animNext=true;flushPending(r.id);renderRecipeDetail(itemById(r.id)||r,{dir:"back"});
    }catch(err){btn.disabled=false;btn.textContent=isNew?"Agregar receta":"Guardar cambios";toast(err.message||"No se pudo guardar la receta.","x");}
  }
  if(e.target.id==="review-form"){
    syncDraft();
    const K=KINDS[draft.kind];
    if(!K.crit.some(([k])=>draft[k]>0)){toast("Califica al menos un criterio","x");return;}
    const {kind,...r}=draft;r.updatedAt=Date.now();if(names[me]&&isGuest())r.byName=names[me];
    btn.disabled=true;
    try{
      await putDoc(K.coll,r);
      if(kind==="place"){const p=itemById(r.placeId);if(p&&p.estado!=="visitado")await putDoc("places",{...p,estado:"visitado"});flushPending(r.placeId);}
      draft=null;toast("Reseña guardada");refreshAfterForm();
    }catch(err){btn.disabled=false;toast("No se pudo guardar la reseña.","x");}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="coc-new"){e.preventDefault();addCocina();return;}
  if(e.key==="Enter"&&e.target.id==="geo-q"){e.preventDefault();geoSearch(e.target.value);return;}
  if(e.key==="Enter"&&e.target.id==="who-name"){e.preventDefault();chooseGuest();return;}
  if(!$("#viewer").hidden){if(e.key==="Escape")closeViewer();if(e.key==="ArrowRight"&&viewerList.length>1){viewerIdx=(viewerIdx+1)%viewerList.length;viewerConfirm=false;renderViewer();}if(e.key==="ArrowLeft"&&viewerList.length>1){viewerIdx=(viewerIdx-1+viewerList.length)%viewerList.length;viewerConfirm=false;renderViewer();}return;}
  if(e.key==="Escape"&&!$("#overlay").hidden)closeSheet();
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"||e.target.id==="rq"){const obj=e.target.id==="q"?filt:rf;obj.q=e.target.value;const id=e.target.id,pos=e.target.selectionStart;render();const q=$("#"+id);if(q){q.focus();q.setSelectionRange(pos,pos);}}
});
document.addEventListener("change",e=>{
  const id=e.target.id,v=e.target.value,map2={"f-zona":[filt,"zona"],"f-orden":[filt,"orden"],"rk-cocina":[rk,"cocina"],"rk-zona":[rk,"zona"],"rk-precio":[rk,"precio"],"rk-min":[rk,"min"],"rf-cocina":[rf,"cocina"],"rf-orden":[rf,"orden"],"rr-cocina":[rrk,"cocina"],"rr-fac":[rrk,"facilidad"],"rr-precio":[rrk,"precio"],"rr-min":[rrk,"min"]};
  if(map2[id]){map2[id][0][map2[id][1]]=v;animNext=true;render();}
  if(id==="pf-zona"&&placeDraft)placeDraft.zona=v;
  if(id==="rf-precio"){const n=+v.replace(/\D/g,"");e.target.value=n?n.toLocaleString("es-CO"):"";}
});
document.addEventListener("dragover",e=>{if(sheetMode&&e.dataTransfer?.types?.includes("Files")&&canUpload()){e.preventDefault();document.querySelectorAll(".drop").forEach(d=>d.classList.add("over"));}});
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)document.querySelectorAll(".drop").forEach(d=>d.classList.remove("over"));});
document.addEventListener("drop",e=>{
  if(!sheetMode||!canUpload())return;e.preventDefault();
  const files=[...(e.dataTransfer?.files||[])];if(!files.length)return;
  if(sheetMode==="detail"&&openId)uploadPhotos(openId,files);
  else{files.filter(f=>f.type.startsWith("image/")).forEach(f=>pendingFiles.push({file:f,url:URL.createObjectURL(f)}));syncAnyDraft();rerenderForm();}
});

/* ---------- Clave y persona ---------- */
function gateSheet(html,label){sheetMode="gate";openSheet(html,{label});}
function askPin(err){
  gateSheet(`<div class="sh-head"><span class="t">Mesa para Dos</span></div>
  <div class="sh-body"><form class="f" id="pin-form" novalidate>
    <div class="cover-lg">${orb("pin","utensils")}</div>
    <h2 class="display" style="font-size:32px">Esta mesa es privada</h2>
    <p class="muted" style="margin:0">Escribe la clave para entrar. Se guarda en este dispositivo.</p>
    <div class="field"><label for="pin-in">Clave</label><input id="pin-in" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required data-autofocus>${err?`<span class="hint" style="color:var(--danger)">${esc(err)}</span>`:""}</div>
    <div class="foot"><button type="submit" class="btn fill">Entrar</button></div>
  </form></div>`,"Clave");
}
function askWho(closable){
  const html=`<div class="sh-head"><span class="t">¿Quién eres?</span>${closable?closeBtn:""}</div>
  <div class="sh-body"><h2 class="display" style="font-size:32px">¿Quién está calificando?</h2>
    <p class="muted" style="margin:0">Tus reseñas quedan a tu nombre. Se recuerda en este dispositivo.</p>
    <div class="pills">${people.map((p,i)=>`<button type="button" data-who="${esc(p.id)}" aria-pressed="${me===p.id}"><span class="av ${i?"b":""}" aria-hidden="true">${esc(p.name.charAt(0).toUpperCase())}</span>${esc(p.name)}</button>`).join("")}
      <button type="button" data-who-other aria-pressed="${whoOther||isGuest()}">${ic("userplus")}Otro</button></div>
    ${whoOther||isGuest()?`<div class="who-other"><input id="who-name" placeholder="Tu nombre" value="${isGuest()?esc(names[me]||""):""}" autocomplete="given-name" data-autofocus><button type="button" class="btn fill" data-action="who-guest">Continuar</button></div>
      <p class="hint" style="margin:0">Como invitado puedes calificar los lugares y recetas, pero no crear ni editar.</p>`:""}
  </div>`;
  if(closable){sheetMode="who";openSheet(html,{label:"¿Quién eres?"});}else gateSheet(html,"¿Quién eres?");
}
function chooseGuest(){
  const n=($("#who-name")?.value||"").trim();if(!n){toast("Escribe tu nombre","x");$("#who-name")?.focus();return;}
  me="inv-"+(slug(n)||uid());names[me]=n;lsSet("mesa-yo",me);lsSet("mesa-yo-nombre",n);whoOther=false;closeSheet(true);render();toast(`Hola, ${n}`);
}
function renderMeLine(){
  const el=$("#me-line");if(!el)return;
  if(mode==="live"&&me&&names[me])el.innerHTML=`<span>Calificando como <b>${esc(names[me])}</b>${isGuest()?" · invitado":""}</span><button class="btn ghost sm" data-action="who">Cambiar</button>${pin?`<button class="btn ghost sm" data-action="logout">Salir</button>`:""}`;
  else el.innerHTML="";
}

/* ---------- Arranque ---------- */
function startDemo(){if(mode!=="loading")return;mode="demo";me="ejemplo-sebas";demoData();animNext=true;render();}
let pollT=null;
function startLive(d){
  people=d.people||[];people.forEach(p=>names[p.id]=p.name);
  applyData(d);mode="live";animNext=true;
  if(isGuest()){names[me]=lsGet("mesa-yo-nombre")||names[me]||"Invitado";closeSheet(true);}
  else if(!me||!people.some(p=>p.id===me)){me=null;closeSheet(true);askWho(false);}
  else closeSheet(true);
  render();
  clearInterval(pollT);pollT=setInterval(refresh,20000);
}
async function refresh(){
  if(mode!=="live"||document.hidden)return;
  try{const d=await api("GET");if(applyData(d)&&!["place","recipe","review"].includes(sheetMode))render();}
  catch(e){if(e.code===401){mode="loading";askPin("La clave cambió. Escríbela de nuevo.");}}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh();});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="pin-form")return;
  e.preventDefault();e.stopImmediatePropagation();
  const val=e.target.elements.pin.value.trim();if(!val)return;
  pin=val;
  try{const d=await api("GET");lsSet("mesa-pin",pin);startLive(d);}
  catch(err){pin="";askPin(err.code===401?"Esa no es la clave.":"No se pudo conectar. Intenta de nuevo.");}
},true);
document.addEventListener("click",e=>{
  const w=e.target.closest("[data-who]");
  if(w){me=w.dataset.who;lsSet("mesa-yo",me);lsSet("mesa-yo-nombre",null);whoOther=false;closeSheet(true);render();toast(`Hola, ${names[me]}`);return;}
  if(e.target.closest("[data-who-other]")){whoOther=true;askWho(sheetMode==="who");return;}
  const a=e.target.closest("[data-action]")?.dataset.action;
  if(a==="who"){whoOther=false;askWho(true);}
  if(a==="who-guest"){chooseGuest();}
  if(a==="logout"){["mesa-pin","mesa-yo","mesa-yo-nombre"].forEach(k=>lsSet(k,null));location.reload();}
},true);
(async()=>{
  pin=lsGet("mesa-pin")||"";me=lsGet("mesa-yo")||null;
  if(isGuest())names[me]=lsGet("mesa-yo-nombre")||"Invitado";
  render();
  try{startLive(await api("GET"));}
  catch(e){if(e.code===401){askPin(pin?"La clave guardada ya no sirve.":"");}else startDemo();}
})();
addEventListener("load",()=>{if(view==="mapa")mountMap();});

</script>
</body>
</html>
